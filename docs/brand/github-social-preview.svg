<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">龙盾 Loongdun — GitHub social preview</title>
  <desc id="desc">A warm ivory and deep green social card with the Loongdun key-and-roots mark and a connected credential graph.</desc>
  <defs>
    <clipPath id="canvas"><rect width="1280" height="640"/></clipPath>
    <pattern id="graph-paper" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1280" height="640" fill="#f4f1e8"/>
    <rect x="720" width="560" height="640" fill="#194b45"/>
    <rect x="720" width="560" height="640" fill="url(#graph-paper)"/>

    <!-- Editorial brand lockup. The open space keeps the name legible in a small link card. -->
    <path d="M80 81h44" stroke="#bb5a38" stroke-width="5" stroke-linecap="round"/>
    <text x="143" y="87" fill="#53635d" font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" letter-spacing="3">DEEPLOREX</text>
    <text x="80" y="266" fill="#1f2d2a" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="116" font-weight="700" letter-spacing="2">龙盾</text>
    <text x="84" y="333" fill="#245d55" font-family="Arial, sans-serif" font-size="47" font-weight="700" letter-spacing="5">LOONGDUN</text>
    <path d="M84 365h82" stroke="#bb5a38" stroke-width="7" stroke-linecap="round"/>
    <text x="82" y="440" fill="#2b3b36" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="500">凭证有归处，关系有脉络。</text>

    <g fill="#53635d" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600">
      <text x="84" y="554">离线运行</text>
      <text x="216" y="554">本地加密</text>
      <text x="348" y="554">关系图谱</text>
    </g>
    <g fill="#bb5a38">
      <circle cx="192" cy="547" r="3"/>
      <circle cx="324" cy="547" r="3"/>
    </g>

    <!-- A credential at the centre of a small, intentionally abstract usage graph. -->
    <g fill="none" stroke="#bdd7cd" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="1000" cy="322" r="215" stroke-opacity=".16" stroke-width="1.5"/>
      <circle cx="1000" cy="322" r="265" stroke-opacity=".08" stroke-width="1.5"/>
      <path d="M894 233 C847 191 844 145 805 126" stroke-opacity=".54" stroke-width="3"/>
      <path d="M1080 215 C1121 181 1147 171 1189 171" stroke-opacity=".54" stroke-width="3"/>
      <path d="M875 374 C834 402 815 452 794 486" stroke-opacity=".54" stroke-width="3"/>
      <path d="M1107 391 C1147 424 1159 470 1195 500" stroke-opacity=".54" stroke-width="3"/>
      <path d="M996 174 C996 128 982 96 960 67" stroke-opacity=".34" stroke-width="2"/>
      <path d="M1005 469 C1007 519 991 550 977 582" stroke-opacity=".34" stroke-width="2"/>
    </g>

    <g fill="#194b45" stroke="#91b7a9" stroke-width="3">
      <circle cx="805" cy="126" r="17"/>
      <circle cx="1189" cy="171" r="17"/>
      <circle cx="794" cy="486" r="17"/>
      <circle cx="1195" cy="500" r="17"/>
      <circle cx="960" cy="67" r="9"/>
      <circle cx="977" cy="582" r="9"/>
    </g>
    <g fill="#bb5a38">
      <circle cx="805" cy="126" r="5"/>
      <circle cx="1195" cy="500" r="5"/>
    </g>
    <g fill="#e6e5d8">
      <circle cx="1189" cy="171" r="5"/>
      <circle cx="794" cy="486" r="5"/>
    </g>

    <circle cx="1000" cy="322" r="151" fill="#113e39" opacity=".38"/>
    <circle cx="1000" cy="316" r="139" fill="#f4f1e8"/>
    <circle cx="1000" cy="316" r="139" fill="none" stroke="#e2dfd3" stroke-width="2"/>

    <!-- Loongdun's existing key-and-roots mark, scaled from src-tauri/icons/icon.svg. -->
    <g transform="translate(870 183) scale(.51)">
      <circle cx="216" cy="214" r="91" fill="none" stroke="#245d55" stroke-width="34"/>
      <path d="M278 276l122 122m-53-68l35-35m-68 2l35-35" fill="none" stroke="#245d55" stroke-width="34" stroke-linecap="round"/>
      <path d="M167 305c-9 45-36 67-71 86m105-72c-2 41 14 66 42 88" fill="none" stroke="#bb5a38" stroke-width="18" stroke-linecap="round"/>
    </g>

    <path d="M80 601h1120" stroke="#245d55" stroke-opacity=".12"/>
  </g>
</svg>
